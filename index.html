<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toy Battle — Scoreboard</title>
<style>
  :root{
    --t1:#3a5a1e; --t1b:#5a7d2e;   /* Team 1 dark green */
    --t2:#e6a92e; --t2b:#f0c14b;   /* Team 2 orange */
    --t3:#9a9a3a; --t3b:#b5b54e;   /* Team 3 olive */
    --t4:#e9e07a; --t4b:#f2eaa0;   /* Team 4 light yellow */
    --ink:#2b2b24; --line:#e3e3d4; --paper:#ffffff;
    --bg:#f4f1e4; --muted:#8a8a76; --star:#f5b301;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overflow-x:hidden}
  body{
    margin:0; font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
    min-height:100vh; padding:22px 16px 50px; position:relative;
  }
  /* Toy Battle art as fixed background with a soft scrim for readability */
  body::before{
    content:""; position:fixed; inset:0; z-index:-2;
    background:url("background.png") center top / cover no-repeat;
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1;
    background:linear-gradient(180deg, rgba(244,241,228,.55) 0%, rgba(244,241,228,.78) 45%, rgba(244,241,228,.92) 100%);
  }
  .wrap{max-width:1180px; margin:0 auto; position:relative;}

  /* ---------- Header ---------- */
  header.hero{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .badge{
    background:linear-gradient(#6b7683,#3d4650); color:#fff; font-weight:900;
    letter-spacing:1px; padding:10px 18px; border-radius:14px; line-height:1;
    box-shadow:0 6px 0 #2b323a, 0 10px 18px rgba(0,0,0,.28);
    border:2px solid rgba(255,255,255,.25); text-align:center; flex:none;
  }
  .badge .t,.badge .b{font-size:24px; display:block}
  .badge .b{color:#ffd34d}
  .logo h1{margin:0; font-size:22px; letter-spacing:.5px}
  .logo p{margin:2px 0 0; color:var(--muted); font-size:13px}

  /* ---------- Leaderboard strip ---------- */
  .leader{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px;}
  .lead-card{
    background:var(--paper); border-radius:14px; padding:12px 14px; border:1.5px solid var(--line);
    box-shadow:0 3px 10px rgba(0,0,0,.06); display:flex; align-items:center; gap:12px;
    position:relative; overflow:hidden;
  }
  .lead-card .rank{
    width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
    font-weight:900; color:#fff; background:#b9b9a6; flex:none; font-size:15px;
  }
  .lead-card.r1 .rank{background:linear-gradient(#f7d14a,#e0a80f)}
  .lead-card.r2 .rank{background:linear-gradient(#cfd3d8,#a7adb4)}
  .lead-card.r3 .rank{background:linear-gradient(#e2a877,#c07c45)}
  .lead-card .nm{font-weight:800; font-size:14px}
  .lead-card .sc{margin-left:auto; font-weight:900; font-size:16px; color:var(--star); white-space:nowrap}
  .lead-card .swatch{position:absolute; left:0; top:0; bottom:0; width:5px}

  /* ---------- Team grid ---------- */
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px}
  .team{
    background:var(--paper); border-radius:18px; overflow:hidden;
    box-shadow:0 8px 22px rgba(0,0,0,.10); border:1px solid var(--line);
    display:flex; flex-direction:column;
  }
  .team-hd{
    padding:13px 16px; display:flex; align-items:center; justify-content:space-between;
    color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .team1 .team-hd{background:linear-gradient(120deg,var(--t1),var(--t1b))}
  .team2 .team-hd{background:linear-gradient(120deg,var(--t2),var(--t2b)); color:#4a3600; text-shadow:none}
  .team3 .team-hd{background:linear-gradient(120deg,var(--t3),var(--t3b))}
  .team4 .team-hd{background:linear-gradient(120deg,var(--t4),var(--t4b)); color:#4a4318; text-shadow:none}
  .team-hd h2{margin:0; font-size:19px; letter-spacing:.4px}
  .team-total{
    background:rgba(255,255,255,.92); color:#3a3a2c; font-weight:900; font-size:14px;
    padding:5px 12px; border-radius:10px; display:flex; align-items:center; gap:5px;
  }
  .team-total .lbl{font-size:10px; font-weight:700; opacity:.65; text-transform:uppercase; letter-spacing:.5px}

  /* ---------- Score table ---------- */
  .tscroll{overflow-x:auto}
  table{width:100%; border-collapse:collapse; font-size:14px}
  thead th{
    background:#faf8ee; color:var(--muted); font-size:11px; text-transform:uppercase;
    letter-spacing:.5px; font-weight:800; padding:9px 8px; text-align:center;
    border-bottom:2px solid var(--line);
  }
  thead th.player-h{text-align:left}
  tbody td{padding:6px 8px; border-bottom:1px solid var(--line); text-align:center}
  tbody td.player{
    text-align:left; font-weight:700; font-size:15px;
    border-right:1px solid var(--line); background:#fcfcf6;
  }
  tbody tr:last-child td{border-bottom:none}
  .player-cell{display:flex; align-items:center; gap:10px}
  .pname{line-height:1.15}
  .rank-col{background:#fcfcf6; border-right:1px solid var(--line); width:52px}
  .rankpill{
    min-width:30px; height:30px; padding:0 6px; border-radius:9px; margin:0 auto;
    display:inline-grid; place-items:center; font-size:15px; font-weight:900;
    background:#eef0e0; color:#6a6a55; font-variant-numeric:tabular-nums;
  }
  .rankpill.r1{background:#fff3cf; color:#a9820c}
  .rankpill.r2{background:#eef0f2; color:#7c8792}
  .rankpill.r3{background:#f6e4d3; color:#a56a3c}

  /* ---- member profile avatar (display only) ---- */
  .avatar{
    width:72px; height:72px; border-radius:50%; flex:none;
    object-fit:cover; border:3px solid #fff; box-shadow:0 2px 7px rgba(0,0,0,.22);
    background-size:cover; background-position:center;
  }
  .avatar.ph{
    display:grid; place-items:center; color:#fff; font-weight:800; font-size:24px;
    text-shadow:0 1px 1px rgba(0,0,0,.25);
  }

  /* ---- eliminated player gag ---- */
  .elim .pname{color:#b23a2a; text-decoration:line-through; text-decoration-thickness:2px}
  .elim-tag{
    display:block; text-decoration:none; margin-top:2px; font-size:9px; font-weight:900;
    letter-spacing:.6px; color:#fff; background:#c0392b; padding:2px 6px; border-radius:6px;
    width:max-content; animation:tagBlink 1.4s steps(1) infinite;
  }
  @keyframes tagBlink{0%,60%{opacity:1}61%,100%{opacity:.45}}
  .elim-wrap{position:relative; display:inline-flex; flex:none}
  /* Master 5s saga: idle -> kicked & dizzy -> OUT stamp -> launched off to China -> reset */
  .elim .avatar{filter:grayscale(1) contrast(.92) brightness(.98); transform-origin:50% 90%; animation:elimSaga 5s ease-in-out infinite}
  @keyframes elimSaga{
    0%,48%{transform:rotate(0) translate(0,0) scale(1); opacity:1}
    52%{transform:rotate(-20deg) translate(-5px,2px) scale(1); opacity:1}   /* boot connects */
    57%{transform:rotate(16deg) translate(7px,-3px) scale(1)}
    62%{transform:rotate(-9deg) translate(-2px,0) scale(1)}
    67%{transform:rotate(0) translate(0,0) scale(1); opacity:1}              /* dazed, holding OUT stamp */
    71%{transform:rotate(-16deg) translate(-7px,1px) scale(1); opacity:1}    /* wind up */
    84%{transform:rotate(680deg) translate(150px,-95px) scale(.12); opacity:0}  /* launched away */
    85%,94%{opacity:0}
    100%{transform:rotate(0) translate(0,0) scale(1); opacity:1}             /* comes back for the next round */
  }
  .elim-wrap .boot{
    position:absolute; left:-8px; bottom:-2px; font-size:24px; z-index:3; opacity:0;
    animation:bootKick 5s ease-in-out infinite; will-change:transform,opacity;
  }
  @keyframes bootKick{
    0%,45%{transform:translateX(-34px) rotate(-12deg); opacity:0}
    52%{transform:translateX(8px) rotate(24deg); opacity:1}   /* kick lands */
    60%{transform:translateX(-2px) rotate(6deg); opacity:1}
    70%{transform:translateX(-34px) rotate(-12deg); opacity:0}
    100%{opacity:0}
  }
  .elim-wrap .dizzy{
    position:absolute; top:-10px; right:-6px; font-size:16px; z-index:3; opacity:0;
    animation:dizzy 5s ease-in-out infinite;
  }
  @keyframes dizzy{
    0%,50%{opacity:0; transform:scale(.4) rotate(0)}
    57%{opacity:1; transform:scale(1) rotate(20deg)}
    66%{opacity:1; transform:scale(1) rotate(-20deg)}
    70%,100%{opacity:0; transform:scale(.6)}
  }
  .elim-wrap .stamp{
    position:absolute; inset:0; margin:auto; height:22px; z-index:4;
    display:grid; place-items:center; padding:0 7px; border-radius:6px;
    background:#c0392b; color:#fff; font-weight:900; font-size:13px; letter-spacing:.5px;
    border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.35); white-space:nowrap;
    transform:rotate(-15deg) scale(2.4); opacity:0; width:max-content;
    animation:stampSlap 5s ease-in-out infinite;
  }
  @keyframes stampSlap{
    0%,54%{opacity:0; transform:rotate(-15deg) scale(2.4)}
    59%{opacity:1; transform:rotate(-15deg) scale(.85)}
    63%{transform:rotate(-15deg) scale(1.08)}
    67%{opacity:1; transform:rotate(-15deg) scale(1)}
    70%,100%{opacity:0; transform:rotate(-15deg) scale(1)}   /* clears just before launch */
  }
  /* fly-away back to China */
  .elim-wrap .plane{
    position:absolute; left:0; bottom:6px; font-size:22px; z-index:5; opacity:0;
    animation:planeFly 5s ease-in-out infinite;
  }
  @keyframes planeFly{
    0%,70%{opacity:0; transform:translate(-4px,4px) rotate(-8deg) scale(.6)}
    74%{opacity:1; transform:translate(6px,-6px) rotate(-16deg) scale(1)}
    88%{opacity:1; transform:translate(120px,-80px) rotate(-18deg) scale(.7)}
    93%,100%{opacity:0; transform:translate(150px,-95px) rotate(-18deg) scale(.5)}
  }
  .elim-wrap .flag{
    position:absolute; left:0; bottom:6px; font-size:16px; z-index:5; opacity:0;
    animation:flagTrail 5s ease-in-out infinite;
  }
  @keyframes flagTrail{
    0%,72%{opacity:0; transform:translate(0,0) scale(.5)}
    78%{opacity:1; transform:translate(2px,-3px) scale(.9)}
    90%{opacity:1; transform:translate(95px,-64px) scale(.7)}
    94%,100%{opacity:0; transform:translate(120px,-78px) scale(.5)}
  }
  .elim-wrap .byebye{
    position:absolute; top:-15px; left:50%; z-index:5; font-size:11px; font-weight:900;
    color:#c0392b; white-space:nowrap; opacity:0; text-shadow:0 1px 2px rgba(255,255,255,.8);
    animation:byebye 5s ease-in-out infinite;
  }
  @keyframes byebye{
    0%,73%{opacity:0; transform:translate(-50%,4px)}
    80%{opacity:1; transform:translate(-50%,-6px)}
    90%{opacity:1; transform:translate(-50%,-12px)}
    93%,100%{opacity:0; transform:translate(-50%,-16px)}
  }
  @media(prefers-reduced-motion:reduce){
    .elim .avatar{animation:none; opacity:1}
    .elim-wrap .boot,.elim-wrap .dizzy,.elim-wrap .plane,.elim-wrap .flag,.elim-wrap .byebye,.elim-tag{animation:none}
    .elim-wrap .stamp{animation:none; opacity:1; transform:rotate(-15deg) scale(1)}
    .elim-wrap .boot,.elim-wrap .dizzy,.elim-wrap .plane,.elim-wrap .flag,.elim-wrap .byebye{opacity:0}
  }
  /* ---- 1st-place fire / Super-Saiyan aura ---- */
  .fx-wrap{position:relative; display:inline-flex; flex:none}
  .fx-wrap .avatar{
    position:relative; z-index:1; border-color:#ffe082;
    animation:ssjRing .45s ease-in-out infinite alternate;
  }
  @keyframes ssjRing{
    from{box-shadow:0 0 0 2px #ffca28, 0 0 10px 2px rgba(255,171,0,.6)}
    to{box-shadow:0 0 0 3px #fff1a8, 0 0 22px 7px rgba(255,193,7,.95)}
  }
  .fx-wrap .aura{
    position:absolute; inset:-11px; border-radius:50%; z-index:0;
    background:radial-gradient(circle, rgba(255,224,90,.9) 0%, rgba(255,152,0,.5) 42%, rgba(255,120,0,0) 70%);
    filter:blur(3px); animation:auraPulse .7s ease-in-out infinite alternate;
  }
  @keyframes auraPulse{from{transform:scale(.9); opacity:.6} to{transform:scale(1.15); opacity:1}}
  .fx-wrap .flame{
    position:absolute; top:-16px; left:50%; z-index:2; font-size:22px;
    filter:drop-shadow(0 0 5px rgba(255,140,0,.9));
    animation:flick .16s steps(2) infinite;
  }
  @keyframes flick{
    from{transform:translateX(-50%) scale(1) rotate(-4deg)}
    to{transform:translateX(-50%) scale(1.15) rotate(4deg)}
  }
  .fx-wrap .spark{
    position:absolute; bottom:8px; width:6px; height:6px; border-radius:50%; z-index:2;
    background:#ffe082; box-shadow:0 0 6px 1px #ffb300; opacity:0;
  }
  .fx-wrap .spark.s1{left:6px;  animation:rise 1s   linear infinite}
  .fx-wrap .spark.s2{left:48%;  animation:rise 1.2s linear .3s infinite}
  .fx-wrap .spark.s3{right:6px; animation:rise .9s  linear .55s infinite}
  @keyframes rise{
    0%{opacity:0; transform:translateY(4px) scale(.6)}
    20%{opacity:1}
    100%{opacity:0; transform:translateY(-38px) scale(.2)}
  }
  @media(prefers-reduced-motion:reduce){
    .fx-wrap .avatar{animation:none; box-shadow:0 0 0 3px #ffca28, 0 0 14px 4px rgba(255,171,0,.7)}
    .fx-wrap .aura{animation:none; opacity:.8}
    .fx-wrap .flame{animation:none}
    .fx-wrap .spark{animation:none; opacity:0}
  }
  /* ---- flag badge + speech bubble ---- */
  .deco-wrap{position:relative; display:inline-flex; flex:none}
  .flagbadge{
    position:absolute; right:-4px; bottom:-4px; width:24px; height:24px; border-radius:50%;
    background:#fff; display:grid; place-items:center; font-size:14px; overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.35); z-index:3; line-height:1;
  }
  .msgbox{
    position:relative; display:inline-block; align-self:center; margin-left:12px; flex:none;
    max-width:150px; white-space:normal; line-height:1.25;
    background:#2b2b24; color:#fff; font-size:11px; font-weight:700;
    padding:5px 9px; border-radius:10px; z-index:2; box-shadow:0 3px 9px rgba(0,0,0,.28);
    animation:msgBob 2.2s ease-in-out infinite;
  }
  .msgbox::after{  /* tail pointing left toward the name/avatar */
    content:""; position:absolute; right:100%; top:50%; margin-top:-6px;
    border:6px solid transparent; border-right-color:#2b2b24;
  }
  @keyframes msgBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  /* fun animation — Bob only (.msg-fun) */
  .msgbox.msg-fun{
    background:linear-gradient(135deg,#e74c3c,#c0392b);
    box-shadow:0 3px 12px rgba(192,57,43,.55);
    animation:msgFun 1.1s ease-in-out infinite;
  }
  .msgbox.msg-fun::after{border-right-color:#c0392b}
  @keyframes msgFun{
    0%   {transform:rotate(0)     scale(1)}
    12%  {transform:rotate(-6deg) scale(1.08)}
    26%  {transform:rotate(6deg)  scale(1.08)}
    40%  {transform:rotate(-4deg) scale(1.05)}
    54%  {transform:rotate(3deg)  scale(1.05)}
    68%  {transform:rotate(-2deg) scale(1.03)}
    100% {transform:rotate(0)     scale(1)}
  }
  @media(prefers-reduced-motion:reduce){ .msgbox,.msgbox.msg-fun{animation:none} }
  .match-no{color:var(--muted); font-variant-numeric:tabular-nums; font-weight:600}
  .stars-cell{font-weight:800; font-variant-numeric:tabular-nums; color:var(--ink)}
  .wl{
    display:inline-grid; place-items:center; min-width:44px; padding:3px 8px; border-radius:999px;
    font-size:10px; font-weight:900; letter-spacing:.5px;
  }
  .wl.w{background:#e6f4ea; color:#1e7a3d; border:1px solid #b7e0c4}
  .wl.l{background:#fdecea; color:#c0392b; border:1px solid #f3c6c0}
  .wl.none{color:#c9c9b8; font-weight:700}
  .point-cell{font-weight:900; color:#3557b7; font-size:17px; background:#eef2fd; white-space:nowrap; font-variant-numeric:tabular-nums}
  .point-cell .pt{font-size:10px; font-weight:800; opacity:.7; margin-left:2px}
  .total-cell{font-weight:900; color:var(--star); font-size:16px; background:#fffdf3; white-space:nowrap}
  .total-cell .s{font-size:12px}

  .foot{margin-top:22px; text-align:center; color:var(--muted); font-size:12px}

  /* ---------- Responsive / mobile ---------- */
  @media(max-width:820px){
    .grid{grid-template-columns:1fr}
    .leader{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:560px){
    body{padding:14px 10px 40px}
    header.hero{gap:11px; margin-bottom:14px}
    .badge{padding:8px 13px} .badge .t,.badge .b{font-size:20px}
    .logo h1{font-size:18px} .logo p{font-size:12px}
    .team-hd{padding:11px 13px} .team-hd h2{font-size:17px}
    table{font-size:13px}
    thead th{padding:7px 5px; font-size:10px; letter-spacing:.3px}
    tbody td{padding:6px 5px}
    tbody td.player{font-size:14px}
    .pname{white-space:normal; word-break:break-word}
    .player-cell{gap:8px}
    .rank-col{width:40px}
    .rankpill{min-width:26px; height:26px; font-size:13px; border-radius:8px}
    .avatar{width:54px; height:54px; border-width:2px}
    .avatar.ph{font-size:18px}
    .total-cell{font-size:14px}
    .wl{min-width:34px; padding:3px 5px; font-size:9px}
  }
  @media(max-width:380px){
    .leader{grid-template-columns:1fr}
    .avatar{width:46px; height:46px}
    .player-cell{gap:6px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="badge"><span class="t">TOY</span><span class="b">BATTLE</span></div>
    <div class="logo">
      <h1>Scoreboard ⭐</h1>
      <p>Round standings &middot; players ranked by total stars</p>
    </div>
  </header>

  <div class="leader" id="leader"></div>

  <div class="grid" id="grid"></div>

  <div class="foot"><b id="mcount">2</b> matches this round</div>
</div>

<script>
/* ---------------- Data (edit here to update scores) ---------------- */
const COLORS = {
  team1:{dot:'#3a5a1e'}, team2:{dot:'#e6a92e'},
  team3:{dot:'#9a9a3a'}, team4:{dot:'#e9e07a'},
};

const DATA = {
  matches: 2,
  // a player is either "Name" (photo derived from name) or {name, photo}
  teams: [
    {id:'team1', name:'Team 1', players:[{name:'ຄົນຈີນ', photo:'Noy.png', eliminated:true, flag:'🇨🇳', bye:'再见!'}, {name:'Pele', flag:'🇰🇭'}, {name:'Bob', msg:'ຢາກຕົບອ້າຍນ້ອຍ', msgFun:true}]},
    {id:'team2', name:'Team 2', players:[{name:'ເຕັກໂນໂລເຈຍ/ບູລີ່ຄົນຈີນ', photo:'Lasun.png'}, {name:'ໄທທ່າແຂກໃນເມືອງ', photo:'Moto.png'}, 'Bank']},
    {id:'team3', name:'Team 3', players:['Katai', 'Mui', {name:'ຫົວໜ້າກົມ', photo:'Alo.png'}]},
    {id:'team4', name:'Team 4', players:[{name:'Aiy Savath', flag:'🇦🇷'}, {name:'Nico', photo:'Nico.jpeg', flag:'🇫🇷', msg:'Why too easy 🥱'}, {name:'Mina', flag:'🇯🇵', eliminated:true, bye:'さよなら!'}]},
  ],
  // scores[teamId][playerIndex] = [starsMatch1, starsMatch2]
  scores:{
    team1:{ 0:[10,16], 1:[17,21], 2:[15,19] },   // Noy 10/16, Pele 17/21, Bob 15/19
    team2:{ 0:[16,16], 1:[2,15],  2:[16,6] },     // Lasun 16/16, Moto 2/15, Bank 16/6
    team3:{ 0:[0,0],   1:[8,0],   2:[14,0] },     // Katai 0, Mui 8, Alo 14
    team4:{ 0:14, 1:27, 2:15 },   // totals only (per-match split not recorded): Aiy Savath 14, Nico 27, Mina 15
  },
  // results[teamId][playerIndex] = ['W'|'L'|'' per match]
  results:{
    team1:{ 0:['L','W'], 1:['L','W'], 2:['W','L'] },  // Noy L/W, Pele L/W, Bob W/L
    team2:{ 0:['L','W'], 1:['L','W'], 2:['W','L'] },   // Lasun L/W, Moto L/W, Bank W/L
    team3:{ 0:['L','W'], 1:['L','L'], 2:['W',''] },    // Katai L/W, Mui L/L, Alo W/–
    team4:{ 0:['L','W'], 1:['W','W'], 2:['L','L'] },  // Aiy Savath L/W, Nico W/W, Mina L/L
  },
};

/* ---------------- Helpers ---------------- */
function scoreEntry(tid,i){ return (DATA.scores[tid]||{})[i]; }
function starsAt(tid,i,m){ const e=scoreEntry(tid,i); return Array.isArray(e) ? (e[m]||0) : null; } // null = per-match not recorded
function resultAt(tid,i,m){ return (((DATA.results||{})[tid]||{})[i]||[])[m] || ''; }
function playerTotal(tid,i){ const e=scoreEntry(tid,i); if(typeof e==='number') return e; let s=0; if(Array.isArray(e)) for(let m=0;m<DATA.matches;m++) s+=(e[m]||0); return s; }
function playerPoints(tid,i){ let p=0; for(let m=0;m<DATA.matches;m++) if(resultAt(tid,i,m)==='W') p++; return p; }  // win=1, lose=0
function teamTotal(tid){ const t=DATA.teams.find(x=>x.id===tid); return t.players.reduce((a,_,i)=>a+playerTotal(tid,i),0); }
function pName(pl){ return typeof pl==='string' ? pl : pl.name; }
function pElim(pl){ return typeof pl==='object' && !!pl.eliminated; }
function pFlag(pl){ return typeof pl==='object' ? (pl.flag||'') : ''; }
function pMsg(pl){ return typeof pl==='object' ? (pl.msg||'') : ''; }
function pMsgFun(pl){ return typeof pl==='object' && !!pl.msgFun; }
function pBye(pl){ return typeof pl==='object' ? (pl.bye||'') : ''; }
function pPhoto(pl){ return encodeURI(typeof pl==='string' ? pl.trim().replace(/\s+/g,'_')+'.png' : (pl.photo || pl.name.trim().replace(/\s+/g,'_')+'.png')); }
function initials(name){ return String(name).trim().split(/\s+/).map(w=>Array.from(w)[0]||'').slice(0,2).join('').toUpperCase()||'?'; }
function imgFail(el){ const s=document.createElement('span'); s.className='avatar ph'; s.style.background=el.dataset.dot; s.textContent=el.dataset.ini; el.replaceWith(s); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- Render ---------------- */
function render(){
  document.getElementById('mcount').textContent = DATA.matches;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  DATA.teams.forEach(t=>{
    const dot = COLORS[t.id].dot;
    const card = document.createElement('div');
    card.className = 'team '+t.id;

    // rank members by points first, then by total stars
    const order = t.players
      .map((pl,i)=>({name:pName(pl), photo:pPhoto(pl), elim:pElim(pl), flag:pFlag(pl), bye:pBye(pl), msg:pMsg(pl), msgFun:pMsgFun(pl), i, total:playerTotal(t.id,i), points:playerPoints(t.id,i)}))
      .sort((a,b)=> b.points-a.points || b.total-a.total || a.i-b.i);

    let rows = '';
    order.forEach(({name,photo,elim,flag,bye,msg,msgFun,i,total,points},rankIdx)=>{
      const rank = rankIdx+1;
      const medal = rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':'';
      const span = DATA.matches;
      let avatar =
        `<img class="avatar" src="${photo}" alt="" data-dot="${dot}" data-ini="${initials(name)}" onerror="imgFail(this)">`;
      const leader = !elim && rank===1 && (points>0 || total>0);   // team's leader gets the fire aura
      const flagBadge = flag?`<span class="flagbadge">${flag}</span>`:'';   // stays on the avatar
      const msgHtml   = msg?`<span class="msgbox${msgFun?' msg-fun':''}">${esc(msg)}</span>`:'';  // inline, after the name
      if(elim){
        const flyFlag = flag || '🇨🇳';
        const byeMsg  = bye  || '再见!';
        avatar = `<span class="elim-wrap">${avatar}<span class="boot">🥾</span><span class="dizzy">💫</span><span class="stamp">OUT!</span><span class="plane">✈️</span><span class="flag">${flyFlag}</span><span class="byebye">${esc(byeMsg)}</span></span>`;
      } else if(leader){
        avatar = `<span class="fx-wrap"><span class="aura"></span>${avatar}<span class="flame">🔥</span><span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>${flagBadge}</span>`;
      } else if(flagBadge){
        avatar = `<span class="deco-wrap">${avatar}${flagBadge}</span>`;
      }
      const cellCls = 'player-cell' + (elim ? ' elim' : '') + (leader ? ' lead' : '');
      for(let m=0; m<DATA.matches; m++){
        rows += '<tr>';
        if(m===0){
          rows += `<td class="rank-col" rowspan="${span}"><span class="rankpill r${rank}">${medal||rank}</span></td>`;
          rows += `<td class="player" rowspan="${span}"><span class="${cellCls}">${avatar}<span class="pname">${esc(name)}${elim?'<span class="elim-tag">ELIMINATED</span>':''}</span>${msgHtml}</span></td>`;
        }
        rows += `<td class="match-no">${m+1}</td>`;
        const st = starsAt(t.id,i,m);
        rows += `<td class="stars-cell">${st==null ? '<span class="wl none">–</span>' : st}</td>`;
        const wl = resultAt(t.id,i,m);
        rows += `<td>${wl==='W'?'<span class="wl w">WIN</span>':wl==='L'?'<span class="wl l">LOSE</span>':'<span class="wl none">–</span>'}</td>`;
        if(m===0){
          rows += `<td class="point-cell" rowspan="${span}">${points}<span class="pt">pt</span></td>`;
          rows += `<td class="total-cell" rowspan="${span}">${total} <span class="s">⭐</span></td>`;
        }
        rows += '</tr>';
      }
    });

    card.innerHTML = `
      <div class="team-hd">
        <h2>${esc(t.name)}</h2>
        <div class="team-total"><span class="lbl">Total</span>${teamTotal(t.id)} ⭐</div>
      </div>
      <div class="tscroll">
        <table>
          <thead><tr>
            <th>Rank</th>
            <th class="player-h">Player</th>
            <th>Match</th>
            <th>Stars</th>
            <th>W/L</th>
            <th>Point</th>
            <th>Total&nbsp;Stars</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    grid.appendChild(card);
  });

  renderLeader();
}

function renderLeader(){
  const ranked = DATA.teams
    .map(t=>({name:t.name, total:teamTotal(t.id), dot:COLORS[t.id].dot}))
    .sort((a,b)=>b.total-a.total);
  document.getElementById('leader').innerHTML = ranked.map((r,idx)=>`
    <div class="lead-card r${idx+1}">
      <span class="swatch" style="background:${r.dot}"></span>
      <span class="rank">${idx+1}</span>
      <span class="nm">${esc(r.name)}</span>
      <span class="sc">${r.total} ⭐</span>
    </div>`).join('');
}

render();
</script>
</body>
</html>
